name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same major version as Neon (18).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: absah
          POSTGRES_PASSWORD: absah
          POSTGRES_DB: absah_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U absah"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI-only throwaway database credentials, not secrets.
      DATABASE_URL: postgresql://absah:absah@localhost:5432/absah_ci
      TEST_DATABASE_URL: postgresql://absah:absah@localhost:5432/absah_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate from zero
        run: |
          psql "$TEST_DATABASE_URL" -c 'create database absah_ci'
          pnpm db:migrate
      - name: Every tenant table has RLS
        run: pnpm db:check-rls

      - name: Lint, typecheck, test
        run: pnpm turbo lint typecheck test

      - name: Architecture rules (dependency-cruiser)
        run: pnpm depcruise

      - name: OpenAPI matches contracts
        run: |
          pnpm --filter @absah/contracts openapi
          git diff --exit-code -- packages/contracts/openapi \
            || (echo "::error::packages/contracts changed but openapi/openapi.json was not regenerated. Run: pnpm --filter @absah/contracts openapi" && exit 1)

      - name: Build
        run: pnpm build
