# Local Postgres 18 (same major as Neon) for integration tests (TEST_DATABASE_URL). Not used in production.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: absah
      POSTGRES_PASSWORD: absah
      POSTGRES_DB: absah_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absah"]
      interval: 2s
      retries: 20
